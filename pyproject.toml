[project]
name = "realtime-detection-yolo26"
version = "0.1.0"
description = "Real-time object detection with YOLOE-26L and Grounding DINO"
requires-python = ">=3.11"
dependencies = [
    # ── Shared / common packages ──────────────────────────────────────────
    "aioice==0.10.2",
    "aiortc==1.14.0",
    "altair==6.0.0",
    "attrs==25.4.0",
    "av==16.1.0",
    "blinker==1.9.0",
    "cachetools==6.2.4",
    "certifi==2026.1.4",
    "cffi==2.0.0",
    "charset-normalizer==3.4.4",
    "click==8.3.1",
    "contourpy==1.3.3",
    "cryptography==46.0.3",
    "cycler==0.12.1",
    "dnspython==2.8.0",
    "filelock==3.20.3",
    "fonttools==4.61.1",
    "fsspec==2026.1.0",
    "ftfy==6.3.1",
    "gitdb==4.0.12",
    "GitPython==3.1.46",
    "google-crc32c==1.8.0",
    "idna==3.11",
    "ifaddr==0.2.0",
    "Jinja2==3.1.6",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "kiwisolver==1.4.9",
    "MarkupSafe==3.0.3",
    "matplotlib==3.10.8",
    "mpmath==1.3.0",
    "narwhals==2.15.0",
    "networkx==3.6.1",
    "numpy==2.4.1",
    # CUDA packages: Linux / Windows only (NVIDIA GPU acceleration)
    "nvidia-cublas-cu12==12.8.4.1; sys_platform != 'darwin'",
    "nvidia-cuda-cupti-cu12==12.8.90; sys_platform != 'darwin'",
    "nvidia-cuda-nvrtc-cu12==12.8.93; sys_platform != 'darwin'",
    "nvidia-cuda-runtime-cu12==12.8.90; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12==9.10.2.21; sys_platform != 'darwin'",
    "nvidia-cufft-cu12==11.3.3.83; sys_platform != 'darwin'",
    "nvidia-cufile-cu12==1.13.1.3; sys_platform != 'darwin'",
    "nvidia-curand-cu12==10.3.9.90; sys_platform != 'darwin'",
    "nvidia-cusolver-cu12==11.7.3.90; sys_platform != 'darwin'",
    "nvidia-cusparse-cu12==12.5.8.93; sys_platform != 'darwin'",
    "nvidia-cusparselt-cu12==0.7.1; sys_platform != 'darwin'",
    "nvidia-nccl-cu12==2.27.5; sys_platform != 'darwin'",
    "nvidia-nvjitlink-cu12==12.8.93; sys_platform != 'darwin'",
    "nvidia-nvshmem-cu12==3.3.20; sys_platform != 'darwin'",
    "nvidia-nvtx-cu12==12.8.90; sys_platform != 'darwin'",
    "opencv-python==4.13.0.90",
    "packaging==25.0",
    "pandas==2.3.3",
    "pillow==12.1.0",
    "polars==1.37.1",
    "polars-runtime-32==1.37.1",
    "protobuf==6.33.4",
    "psutil==7.2.1",
    "pyarrow==23.0.0",
    "pycparser==2.23",
    "pydeck==0.9.1",
    "pyee==13.0.0",
    "pylibsrtp==1.0.0",
    "pyOpenSSL==25.3.0",
    "pyparsing==3.3.1",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "PyYAML==6.0.3",
    "referencing==0.37.0",
    "regex==2026.1.15",
    "requests==2.32.5",
    "rpds-py==0.30.0",
    "scipy==1.17.0",
    "setuptools==80.9.0",
    "six==1.17.0",
    "smmap==5.0.2",
    "streamlit==1.53.0",
    "streamlit-webrtc==0.64.5",
    "sympy==1.14.0",
    "tenacity==9.1.2",
    "toml==0.10.2",
    # PyTorch: macOS uses the default PyPI build (MPS support is built-in);
    # Linux/Windows gets CUDA 12.x wheels via the nvidia-* packages above.
    "torch==2.9.1",
    "torchvision==0.24.1",
    "tornado==6.5.4",
    "tqdm==4.67.1",
    # Triton (kernel compiler) is Linux-only
    "triton==3.5.1; sys_platform != 'darwin'",
    "typing_extensions==4.15.0",
    "tzdata==2025.3",
    "urllib3==2.6.3",
    "watchdog==6.0.0",
    "wcwidth==0.2.14",
]

[project.optional-dependencies]
# ── Ultralytics YOLO backend (app.py / cli.py) ────────────────────────────
yolo = [
    "clip @ git+https://github.com/ultralytics/CLIP.git@643beff3883b5720d94b6b9c9eca12fa9fb72fb1",
    "ultralytics==8.4.6",
    "ultralytics-thop==2.0.18",
]

# ── Grounding DINO backend (app_dino.py / cli_dino.py) ───────────────────
# On macOS the standard PyTorch wheel already includes MPS support;
# no extra index URL is needed.  On Linux, install torch with CUDA first:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
# then install this extra set.
dino = [
    "groundeddino_vl",
    "supervision",
    "transformers>=4.30,<5",
]
